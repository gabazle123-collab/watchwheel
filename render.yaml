services:
  - type: web
    name: watchwheel
    runtime: node
    buildCommand: npm install
    startCommand: node backend/server.js
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: TMDB_API_KEY
        sync: false
